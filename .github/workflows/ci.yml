# Type-checks, builds and link-checks the site on every push and pull request.
# Vercel does the actual deploy; this catches broken builds and dead links before they get there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Checks every link in the built pages, including the CV and GitHub links.
      # LinkedIn blocks automated requests (HTTP 999), so it's excluded.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --exclude linkedin.com
            'dist/**/*.html'
          fail: true
