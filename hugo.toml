baseURL = 'https://example.org/'
locale = 'en-us'
title = 'My New Hugo Project'
theme = 'hugo-PaperMod'

[caches]
    [caches.images]
    dir = ':cacheDir/images'
    

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 5

[minify]
  disableXML = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "M — SDET / QA Engineer"
  description = "Portfolio of M — SDET/QA and backend engineer based in Melbourne."
  keywords = ["SDET", "QA", "Software Testing", "Backend", "Melbourne", "Portfolio", "Monash"]
  author = "M"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.profileMode]
    enabled = true
    title = "M"
    subtitle = "SDET / QA Engineer · Junior Backend Developer · Melbourne, AU"
    imageUrl = "images/profile.jpg"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "Projects"
      url = "projects"
    [[params.profileMode.buttons]]
      name = "About"
      url = "about"
    [[params.profileMode.buttons]]
      name = "Resume"
      url = "/resume.pdf"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/YOUR_USERNAME"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/YOUR_USERNAME"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:you@example.com"

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10
[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20
[[menu.main]]
  identifier = "certifications"
  name = "Certifications"
  url = "/certifications/"
  weight = 30
[[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 40